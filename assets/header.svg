<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Julio Pürschel — Full Stack Developer</title><desc id="desc">Mais de 5 anos em sistemas corporativos. C#/.NET, SQL Server, integrações e automação. Estudos em Angular e TypeScript.</desc><rect x="1" y="1" width="1198" height="418" rx="24" fill="#0C1423" stroke="#293B55"/><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#23324A" stroke-width="0.6" opacity="0.45"/></pattern><linearGradient id="accent"><stop stop-color="#73DDE8"/><stop offset="1" stop-color="#B3A0F7"/></linearGradient></defs><rect x="690" y="2" width="508" height="416" rx="24" fill="url(#grid)"/><rect x="42" y="46" width="7" height="18" rx="3" fill="#73DDE8"/><text x="62" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#73DDE8" font-weight="700" letter-spacing="2">FULL STACK DEVELOPER / .NET</text><text x="42" y="139" font-family="Arial, Helvetica, sans-serif" font-size="66" fill="#F2F5FA" font-weight="700" letter-spacing="-2">Julio Pürschel</text><text x="44" y="188" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#F2F5FA" font-weight="400" >Código que conecta sistemas,</text><text x="44" y="225" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#F2F5FA" font-weight="400" >processos e pessoas.</text><text x="44" y="268" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#A7B6CC" font-weight="400" >C# / .NET  ·  SQL Server  ·  Integrações  ·  Automação</text><path d="M44 302 H650" stroke="#293B55"/><text x="44" y="344" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#F3C77A" font-weight="700" >5+ ANOS</text><text x="44" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A7B6CC" font-weight="400" >em sistemas corporativos</text><text x="335" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#73DDE8" font-weight="700" >ANGULAR + TYPESCRIPT</text><text x="335" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A7B6CC" font-weight="400" >ampliando minha base de front-end</text><rect x="762" y="62" width="386" height="290" rx="18" fill="#101D30" stroke="#293B55"/><circle cx="785" cy="85" r="4" fill="#F3C77A"/><circle cx="800" cy="85" r="4" fill="#73DDE8"/><circle cx="815" cy="85" r="4" fill="#B3A0F7"/><text x="844" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A7B6CC" font-weight="400" >engineering / mindset</text><text x="800" y="162" font-family="Consolas, monospace" font-size="55" fill="url(#accent)" font-weight="700">{ }</text><text x="800" y="205" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#F2F5FA" font-weight="700" >Entender o negócio.</text><text x="800" y="240" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#F2F5FA" font-weight="700" >Conectar as partes.</text><text x="800" y="275" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#F2F5FA" font-weight="700" >Construir para manter.</text><path d="M800 309 H1110" stroke="#293B55"/></svg>
